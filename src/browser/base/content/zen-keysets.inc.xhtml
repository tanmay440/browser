#include zen-commands.inc.xhtml

<keyset id="zenKeyset">
  <key id="vapor-laser-shortcut"
       key="L"
       modifiers="accel shift"
       oncommand="VaporLaser.toggle(window)" />
  <key id="vapor-new-regular-tab-shortcut"
       key="T"
       modifiers="accel"
       oncommand="VaporRouting.openTab(window, 'regular')" />
  <key id="vapor-new-tor-tab-shortcut"
       key="T"
       modifiers="accel shift"
       oncommand="VaporRouting.openTab(window, 'tor')" />
  <key id="vapor-new-scramjet-tab-shortcut"
       key="T"
       modifiers="accel alt"
       oncommand="VaporRouting.openTab(window, 'scramjet')" />
  <key id="vapor-new-private-tab-shortcut"
       key="P"
       modifiers="accel shift"
       oncommand="VaporRouting.openTab(window, 'private')" />
  <key id="vapor-shield-breaker-shortcut"
       key="B"
       modifiers="accel shift"
       oncommand="VaporFilter.activateShieldBreaker(window)" />
</keyset>
