<groupbox id="vaporPrivacyGroup"
          data-category="panePrivacy"
          class="highlighting-group">
  <label><html:h2 data-l10n-id="vapor-privacy-settings-header"/></label>
  <description class="description-deemphasized"
               data-l10n-id="vapor-privacy-settings-description" />

  <checkbox id="vaporPrivacyURLStripping"
            preference="vapor.privacy.url-stripping.enabled"
            data-l10n-id="vapor-privacy-url-stripping" />
  <hbox align="center">
    <label data-l10n-id="vapor-privacy-url-list" />
    <spacer flex="1" />
    <button id="vaporPrivacyURLStripSave"
            data-l10n-id="vapor-privacy-url-list-save" />
  </hbox>
  <html:textarea id="vaporPrivacyURLStripRules"
                 rows="8"
                 aria-label="URL stripping list" />

  <checkbox id="vaporPrivacyCNAME"
            preference="vapor.privacy.cname-uncloaking.enabled"
            data-l10n-id="vapor-privacy-cname" />

  <hbox align="center">
    <label for="vaporPrivacyReferrerPolicy"
           data-l10n-id="vapor-privacy-referrer-policy" />
    <menulist id="vaporPrivacyReferrerPolicy"
              preference="vapor.privacy.referrer-policy">
      <menupopup>
        <menuitem value="strict-origin-when-cross-origin"
                  data-l10n-id="vapor-privacy-referrer-strict" />
        <menuitem value="strict-origin"
                  data-l10n-id="vapor-privacy-referrer-origin" />
        <menuitem value="off"
                  data-l10n-id="vapor-privacy-referrer-off" />
      </menupopup>
    </menulist>
  </hbox>

  <checkbox id="vaporPrivacyDohEnabled"
            preference="vapor.privacy.doh.enabled"
            data-l10n-id="vapor-privacy-doh" />
  <hbox align="center">
    <label for="vaporPrivacyDohResolver"
           data-l10n-id="vapor-privacy-doh-resolver" />
    <menulist id="vaporPrivacyDohResolver"
              preference="vapor.privacy.doh.resolver">
      <menupopup>
        <menuitem value="mullvad" label="Mullvad DNS" />
        <menuitem value="quad9" label="Quad9" />
        <menuitem value="nextdns" label="NextDNS" />
      </menupopup>
    </menulist>
    <label id="vaporPrivacyDohStatus" class="description-deemphasized" />
  </hbox>

  <checkbox id="vaporPrivacySpeculative"
            preference="vapor.privacy.speculative-loading.enabled"
            data-l10n-id="vapor-privacy-speculative" />

  <separator class="thin" />
  <label><html:h3 data-l10n-id="vapor-privacy-fingerprinting-header"/></label>
  <checkbox id="vaporPrivacyFingerprinting"
            preference="vapor.privacy.fingerprinting.enabled"
            data-l10n-id="vapor-privacy-fingerprinting" />
  <checkbox id="vaporPrivacyExtendedFingerprinting"
            preference="vapor.privacy.fingerprinting.extended"
            data-l10n-id="vapor-privacy-fingerprinting-extended" />
  <hbox align="center">
    <label for="vaporPrivacyTimezone" data-l10n-id="vapor-privacy-timezone" />
    <menulist id="vaporPrivacyTimezone" preference="vapor.privacy.fingerprinting.timezone">
      <menupopup><menuitem value="UTC" label="UTC" /></menupopup>
    </menulist>
    <label for="vaporPrivacyLanguage" data-l10n-id="vapor-privacy-language" />
    <menulist id="vaporPrivacyLanguage" preference="vapor.privacy.fingerprinting.language">
      <menupopup><menuitem value="en-US" label="English (US)" /></menupopup>
    </menulist>
  </hbox>

  <separator class="thin" />
  <label><html:h3 data-l10n-id="vapor-privacy-clipboard-header"/></label>
  <checkbox id="vaporPrivacyClipboard"
            preference="vapor.privacy.clipboard.enabled"
            data-l10n-id="vapor-privacy-clipboard" />

  <separator class="thin" />
  <label><html:h3 data-l10n-id="vapor-privacy-user-agent-header"/></label>
  <hbox align="center">
    <label data-l10n-id="vapor-privacy-user-agent-list" />
    <spacer flex="1" />
    <button id="vaporPrivacyUAOverridesSave" data-l10n-id="vapor-privacy-user-agent-save" />
  </hbox>
  <html:textarea id="vaporPrivacyUAOverrides" rows="5" aria-label="User-Agent overrides" />

  <separator class="thin" />
  <label><html:h3 data-l10n-id="vapor-privacy-script-header"/></label>
  <checkbox id="vaporPrivacyScriptBlocking"
            preference="vapor.privacy.script-blocking.enabled"
            data-l10n-id="vapor-privacy-script-blocking" />
  <description class="description-deemphasized" data-l10n-id="vapor-privacy-script-help" />

  <hbox align="center">
    <label data-l10n-id="vapor-privacy-https-exceptions" />
    <spacer flex="1" />
    <button id="vaporHTTPSExceptionsSave"
            data-l10n-id="vapor-privacy-https-exceptions-save" />
  </hbox>
  <html:textarea id="vaporHTTPSExceptions"
                 rows="5"
                 aria-label="HTTPS-only exceptions" />
</groupbox>
